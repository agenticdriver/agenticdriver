name: SDK checks
on:
  push:
    branches: [sdk-roadmap]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: Linux desktop companion
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bound private CI build cache
        run: python3 deploy/ci-runner/cache-maintenance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci --install-links --prefix apps/desktop
      - run: npm test --prefix apps/desktop
      - run: npm run package:linux --prefix apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenticdriver-desktop-linux-x64
          path: apps/desktop/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  release-candidate:
    needs: documentation
    if: ${{ !cancelled() && github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' }}
    uses: ./.github/workflows/release-candidate.yml
  documentation:
    needs: account-deployment
    if: ${{ !cancelled() && github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' }}
    name: Documentation site
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bound private CI build cache
        run: python3 deploy/ci-runner/cache-maintenance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenticdriver-documentation
          path: site/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
  account-deployment:
    needs: verify
    if: ${{ !cancelled() && github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' }}
    name: Linux account deployment
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bound private CI build cache
        run: python3 deploy/ci-runner/cache-maintenance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && npm run build
      - run: node --test deploy/account/policy.test.mjs
      - name: Build actual deployment images without account credentials
        run: |
          docker build --target runtime -t agenticdriver:ci-account-base .
          docker build --build-arg AGENTICDRIVER_IMAGE=agenticdriver:ci-account-base -t agenticdriver-account:ci-base deploy/account
          docker build --build-arg AGENTICDRIVER_ACCOUNT_IMAGE=agenticdriver-account:ci-base -f deploy/account/Dockerfile.codex -t agenticdriver-account:ci-codex deploy/account
          docker build --build-arg AGENTICDRIVER_ACCOUNT_IMAGE=agenticdriver-account:ci-base -f deploy/account/Dockerfile.claude -t agenticdriver-account:ci-claude deploy/account
          docker build -f deploy/Dockerfile.proxy -t agenticdriver-proxy:ci-account deploy
  verify:
    needs: desktop
    if: ${{ !cancelled() && github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' }}
    name: ${{ matrix.label }}
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Linux minimum runtimes
            node: 22.13.0
            python: "3.10"
            go: "1.22"
            rust: "1.89.0"
          - label: Linux LTS and current clients
            node: "24"
            python: "3.14"
            go: stable
            rust: stable
          - label: Linux current Node
            node: "26"
            python: "3.14"
            go: stable
            rust: stable
    env:
      TMPDIR: ${{ runner.temp }}
      AGENTICDRIVER_TEST_RUST_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bound private CI build cache
        run: python3 deploy/ci-runner/cache-maintenance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
      - run: python -m unittest discover -s tests -p 'ci_*_test.py' -v
      - run: npm ci
      - run: npm run check
      - run: npm run protocol && git diff --exit-code -- protocol/openapi.json protocol/host-config.schema.json protocol/usage-record.schema.json protocol/provider-extension.schema.json
      - run: npm run test:clients
      - run: npm run test:package
