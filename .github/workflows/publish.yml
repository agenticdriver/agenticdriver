name: Publish reviewed SDK candidate
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful SDK checks run for this exact commit
        required: true
        type: string
      candidate_commit:
        description: Optional full commit SHA of that CI candidate (for a delayed channel)
        required: false
        type: string
      registry:
        description: Publish one channel; matching existing artifacts are verified
        required: true
        type: choice
        options: [npm, python, rust, go]
permissions:
  contents: read
concurrency:
  group: sdk-publication-${{ inputs.registry }}
  cancel-in-progress: false
jobs:
  npm:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' && github.event.repository.private == false && inputs.registry == 'npm'
    # npm OIDC requires a hosted runner. Standard runners are free for this
    # public repository; builds, tests and other channels stay on Prometheus.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate the optional candidate revision
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [[ -n "$CANDIDATE_COMMIT" && ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_commit must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the pinned OIDC-capable npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Download and verify the exact Prometheus candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
        run: python3 scripts/publish.py prepare --run-id "$CI_RUN" --registry npm --output "$RUNNER_TEMP/release"
      - name: Publish the reviewed archive using npm trusted publishing
        if: steps.candidate.outputs.pending == 'true'
        env:
          NPM_ARCHIVE: ${{ steps.candidate.outputs.npm_archive }}
          NPM_TAG: ${{ steps.candidate.outputs.npm_tag }}
          # Automatic provenance uses the workflow revision, not checkout HEAD.
          # A delayed channel must not attest its old bytes to a newer commit.
          NPM_CONFIG_PROVENANCE: ${{ (inputs.candidate_commit || github.sha) == github.sha }}
        run: npm publish "$NPM_ARCHIVE" --access public --tag "$NPM_TAG" --ignore-scripts
      - name: Verify the registry has the exact reviewed bytes
        env:
          BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import sys
          import time
          sys.path.insert(0, "scripts")
          from publish import check_registry, pending_files
          from release import verify
          bundle = Path(os.environ["BUNDLE"])
          manifest = verify(bundle, require_clean=True)
          for attempt in range(19):
              # Only absence is retried. Auth errors, outages and wrong bytes
              # raise immediately; this loop never repeats the upload.
              if not pending_files(bundle, manifest, "npm"):
                  check_registry(bundle, "npm")
                  break
              if attempt == 18:
                  raise SystemExit("npm accepted publication but availability is still pending; inspect before retrying")
              print("Waiting for npm registry processing", flush=True)
              time.sleep(10)
          PYTHON
  package:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' && (inputs.registry == 'python' || inputs.registry == 'rust')
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    environment: ${{ inputs.registry }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate the optional candidate revision
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [[ -n "$CANDIDATE_COMMIT" && ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_commit must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - if: inputs.registry == 'rust'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.89.0"
      - name: Verify successful CI and prepare its exact artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
          REGISTRY: ${{ inputs.registry }}
        run: python scripts/publish.py prepare --run-id "$CI_RUN" --registry "$REGISTRY" --output "$RUNNER_TEMP/release"
      - name: Publish missing Python artifacts through the configured trusted publisher
        if: inputs.registry == 'python' && steps.prepare.outputs.pending == 'true'
        env:
          UPLOAD: ${{ steps.prepare.outputs.upload }}
        run: python -c 'import os, shutil; shutil.copytree(os.environ["UPLOAD"], "artifacts/pypi-upload")'
      - name: Upload verified Python files
        if: inputs.registry == 'python' && steps.prepare.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifacts/pypi-upload/
      - name: Verify Cargo's repackaging against the reviewed crate
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        env:
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
          SOURCE: ${{ steps.prepare.outputs.cargo_source }}
        run: python scripts/publish.py check-crate --bundle "$BUNDLE" --source "$SOURCE"
      - name: Obtain the configured crates.io publishing identity
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish the verified Rust crate
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          SOURCE: ${{ steps.prepare.outputs.cargo_source }}
          SOURCE_DATE_EPOCH: ${{ steps.prepare.outputs.epoch }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/release/cargo/target
        run: cargo +1.89.0 publish --locked --manifest-path "$SOURCE/Cargo.toml"
      - name: Verify the actual registry artifacts
        env:
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
          REGISTRY: ${{ inputs.registry }}
        run: python scripts/publish.py verify --bundle "$BUNDLE" --registry "$REGISTRY"
  go:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' && inputs.registry == 'go'
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    environment: go
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate the optional candidate revision
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [[ -n "$CANDIDATE_COMMIT" && ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_commit must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Verify successful CI and prepare its exact artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
        run: python scripts/publish.py prepare --run-id "$CI_RUN" --registry go --output "$RUNNER_TEMP/release"
      - name: Create the immutable Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
        run: python scripts/publish.py publish-go --bundle "$BUNDLE" --run-id "$CI_RUN"
      - run: npm ci
      - name: Install the tagged Go module over the public proxy
        run: |
          VERSION="$(python -c 'import json; print("v" + json.load(open("release/config.json"))["goVersion"])')"
          python scripts/test-go-install.py "$VERSION"
