<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgenticDriver</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#providers" aria-label="AgenticDriver home"
          ><span class="mark" aria-hidden="true">a<span>d</span></span
          ><span>AgenticDriver<small>YOUR AGENTS, CONNECTED</small></span></a
        >
        <nav aria-label="Main navigation">
          <button data-view="providers" class="nav selected">
            <span aria-hidden="true">◈</span>Providers
          </button>
          <button data-view="usage" class="nav">
            <span aria-hidden="true">▥</span>Usage
          </button>
          <button data-view="connections" class="nav">
            <span aria-hidden="true">⇄</span>Connections
            <span id="connection-count" class="count"></span>
          </button>
          <button data-view="hosts" class="nav">
            <span aria-hidden="true">▣</span>Hosts
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div id="local-indicator" class="indicator">
            <i></i><span>Starting local host…</span>
          </div>
          <p>Runs stay on the host you choose.</p>
          <span class="preview-label">DESKTOP PREVIEW · 0.1</span>
        </div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            Workspace <span>/</span>
            <strong id="breadcrumb-view">Providers</strong>
          </div>
          <label class="host-select"
            ><span>Connected host</span
            ><select id="host-select" aria-label="Connected host">
              <option value="local">This computer</option>
            </select></label
          >
        </header>
        <div class="page-head">
          <div>
            <p class="eyebrow" id="eyebrow">PROVIDERS & ACCOUNTS</p>
            <h1 id="title">Your agent workspace</h1>
            <p id="subtitle">
              Manage the providers and models available to your applications.
            </p>
          </div>
          <button id="page-refresh" class="button quiet">↻ Refresh</button>
        </div>
        <div id="notification" role="status" hidden></div>
        <section id="providers-view" class="view">
          <div id="provider-state"></div>
          <div id="provider-mount"></div>
        </section>
        <section id="usage-view" class="view" hidden></section>
        <section id="connections-view" class="view" hidden></section>
        <section id="hosts-view" class="view" hidden></section>
        <footer class="page-footer">
          <span>AgenticDriver</span
          ><span id="endpoint">Private local workspace</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
