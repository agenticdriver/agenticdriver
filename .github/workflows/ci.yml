name: SDK checks
on:
  push:
    branches: [sdk-roadmap]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: Linux desktop companion
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci --install-links --prefix apps/desktop
      - run: npm test --prefix apps/desktop
      - run: npm run package:linux --prefix apps/desktop
      - run: docker build -f apps/desktop/Dockerfile -t agenticdriver-desktop-smoke:local apps/desktop
      - name: Native packaged desktop with renderer sandbox enabled
        run: docker run --rm --init --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined agenticdriver-desktop-smoke:local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenticdriver-desktop-linux-x64
          path: apps/desktop/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  codex-native:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: Offline native Codex contracts
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && npm run build
      - run: docker build -f deploy/ci-runner/codex-native.Dockerfile -t agenticdriver-native-audit:0.157.0 deploy/ci-runner
      - name: Native adapter and tool protocol contracts
        env:
          TASK_SOURCE: ${{ github.workspace }}
          TASK_RECEIPTS: ${{ runner.temp }}/codex-native-receipts
        run: |
          mkdir -p "$TASK_RECEIPTS"
          for suite in adapter tools application-tools; do
            docker run --rm --network none --cap-add SYS_ADMIN --cap-add NET_ADMIN --security-opt seccomp=unconfined \
              --mount "type=bind,source=$TASK_SOURCE,target=/work,readonly" \
              --mount "type=bind,source=$TASK_RECEIPTS,target=/receipts" \
              agenticdriver-native-audit:0.157.0 --suite "$suite" --receipt "/receipts/$suite.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-native-contract-receipts
          path: ${{ runner.temp }}/codex-native-receipts/*.json
          if-no-files-found: error
          retention-days: 7
  release-candidate:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    uses: ./.github/workflows/release-candidate.yml
  documentation:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: Documentation site
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenticdriver-documentation
          path: site/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
  deployment:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: Linux containers and verified TLS
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.89.0"
      - run: npm ci
      - run: npm run test:deployment
  verify:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap'
    name: ${{ matrix.label }}
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux minimum runtimes
            node: 22.13.0
            python: "3.10"
            go: "1.22"
            rust: "1.89.0"
          - label: Linux LTS and current clients
            node: "24"
            python: "3.14"
            go: stable
            rust: stable
          - label: Linux current Node
            node: "26"
            python: "3.14"
            go: stable
            rust: stable
    env:
      AGENTICDRIVER_TEST_RUST_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
      - run: python -m unittest discover -s tests -p ci_runner_test.py -v
      - run: npm ci
      - run: npm run check
      - if: matrix.node != '22.13.0'
        run: npm run test:auth
      - run: npm run protocol && git diff --exit-code -- protocol/openapi.json protocol/host-config.schema.json protocol/usage-record.schema.json protocol/provider-extension.schema.json
      - run: npm run test:clients
      - run: python scripts/test-go-install.py --local-archive
      - run: npm run test:install
      - run: npm run test:package
