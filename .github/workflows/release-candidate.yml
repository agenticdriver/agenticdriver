name: Release candidate artifacts
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'agenticdriver/agenticdriver' && github.ref == 'refs/heads/sdk-roadmap' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Build and install exact release artifacts
    runs-on: [self-hosted, linux, x64, prometheus-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.89.0"
      - run: python -m unittest discover -s tests -p 'release_test.py' -v
      - run: npm ci
      - run: python scripts/release.py build --output "$RUNNER_TEMP/candidate"
      - run: python scripts/release.py verify "$RUNNER_TEMP/candidate" --require-clean
      - run: python scripts/test-release.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenticdriver-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
