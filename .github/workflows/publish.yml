name: Publish reviewed SDK candidate
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful SDK checks run for this exact commit
        required: true
        type: string
      registry:
        description: Publish one channel; matching existing artifacts are verified
        required: true
        type: choice
        options: [npm, python, rust, go]
permissions:
  contents: read
concurrency:
  group: sdk-publication-${{ inputs.registry }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/sdk-roadmap' && inputs.registry != 'go'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.registry }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - if: inputs.registry == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - if: inputs.registry == 'rust'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.89.0"
      - name: Verify successful CI and prepare its exact artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
          REGISTRY: ${{ inputs.registry }}
        run: python scripts/publish.py prepare --run-id "$CI_RUN" --registry "$REGISTRY" --output "$RUNNER_TEMP/release"
      - name: Publish npm through the configured trusted publisher
        if: inputs.registry == 'npm' && steps.prepare.outputs.pending == 'true'
        env:
          ARCHIVE: ${{ steps.prepare.outputs.npm_archive }}
        run: npm publish "$ARCHIVE" --ignore-scripts --access public --tag latest
      - name: Publish missing Python artifacts through the configured trusted publisher
        if: inputs.registry == 'python' && steps.prepare.outputs.pending == 'true'
        env:
          UPLOAD: ${{ steps.prepare.outputs.upload }}
        run: python -c 'import os, shutil; shutil.copytree(os.environ["UPLOAD"], "artifacts/pypi-upload")'
      - name: Upload verified Python files
        if: inputs.registry == 'python' && steps.prepare.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifacts/pypi-upload/
      - name: Verify Cargo's repackaging against the reviewed crate
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        env:
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
          SOURCE: ${{ steps.prepare.outputs.cargo_source }}
        run: python scripts/publish.py check-crate --bundle "$BUNDLE" --source "$SOURCE"
      - name: Obtain the configured crates.io publishing identity
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish the verified Rust crate
        if: inputs.registry == 'rust' && steps.prepare.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          SOURCE: ${{ steps.prepare.outputs.cargo_source }}
          SOURCE_DATE_EPOCH: ${{ steps.prepare.outputs.epoch }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/release/cargo/target
        run: cargo +1.89.0 publish --locked --manifest-path "$SOURCE/Cargo.toml"
      - name: Verify the actual registry artifacts
        env:
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
          REGISTRY: ${{ inputs.registry }}
        run: python scripts/publish.py verify --bundle "$BUNDLE" --registry "$REGISTRY"
  go:
    if: github.ref == 'refs/heads/sdk-roadmap' && inputs.registry == 'go'
    runs-on: ubuntu-24.04
    environment: go
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Verify successful CI and prepare its exact artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
        run: python scripts/publish.py prepare --run-id "$CI_RUN" --registry go --output "$RUNNER_TEMP/release"
      - name: Create the immutable Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
          BUNDLE: ${{ steps.prepare.outputs.bundle }}
        run: python scripts/publish.py publish-go --bundle "$BUNDLE" --run-id "$CI_RUN"
      - run: npm ci
      - name: Install the tagged Go module over the public proxy
        run: |
          VERSION="$(python -c 'import json; print("v" + json.load(open("release/config.json"))["goVersion"])')"
          python scripts/test-go-install.py "$VERSION"
