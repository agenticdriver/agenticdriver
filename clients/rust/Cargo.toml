[package]
name = "agenticdriver"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.89"
description = "Rust client for the AgenticDriver SDK"
license = "MIT"
readme = "README.md"
repository = "https://github.com/agenticdriver/agenticdriver"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "examples/**"]

[features]
default = ["blocking", "async"]
blocking = ["reqwest/blocking"]
async = []

[[example]]
name = "installed_app"
required-features = ["blocking", "async"]

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "test-util"] }
# Used only by the runnable local provider-panel example.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.4"

[[example]]
name = "provider_panel"
required-features = ["async"]
